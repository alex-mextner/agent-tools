name: Follow-up lint review fixes
on:
  push:
    branches: [fix/lint-review-followups]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lint-review-followups
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace(
              'docs/anti-slop.md',
              'The target `oxlint.config.ts` registers `./tools/oxlint/anti-slop/index.ts`, enables every anti-slop rule at error severity, sets type-aware mode, and also enables:',
              'The target `oxlint.config.ts` registers `./tools/oxlint/anti-slop/index.ts` and renders Rig’s audited per-rule severities. Context-sensitive/API-shape rules remain off unless policy enables them; warning rules remain warnings. Type-aware mode also enables:',
          )
          replace(
              'skills/by-stack/frontend/ts/anti-slop/SKILL.md',
              'description: Use when a TypeScript/JavaScript repo adopts or hits anti-slop Oxlint rules.',
              'description: Use when a frontend TypeScript/JavaScript repo adopts or hits anti-slop Oxlint rules.',
          )

          p = Path('git-hooks/lefthook.yml')
          text = p.read_text()
          old = '''    oxlint:\n      glob: "*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"\n      # Type-aware mode is required by the semantic assertion rules in our baseline.\n      # The repo config also loads the vendored anti-slop JS plugin.\n      run: node_modules/.bin/oxlint --type-aware {staged_files}\n      fail_text: "Oxlint / anti-slop policy failed"\n\n    oxfmt:\n      glob: "*.{ts,tsx,js,jsx,mts,cts,mjs,cjs,json,jsonc}"\n      run: node_modules/.bin/oxfmt --check {staged_files}\n      fail_text: "Oxfmt check failed"\n'''
          new = '''    # These commands are enabled by Rig only after the repository declares the\n    # corresponding Oxc tools. The generic example must not make commits fail merely\n    # because a project has not adopted Oxc yet.\n    # oxlint:\n    #   glob: "*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"\n    #   run: node_modules/.bin/oxlint --type-aware {staged_files}\n    #   fail_text: "Oxlint / anti-slop policy failed"\n    # oxfmt:\n    #   glob: "*.{ts,tsx,js,jsx,mts,cts,mjs,cjs,json,jsonc}"\n    #   run: node_modules/.bin/oxfmt --check {staged_files}\n    #   fail_text: "Oxfmt check failed"\n'''
          if old not in text:
              raise SystemExit('expected Oxc lefthook block not found')
          p.write_text(text.replace(old, new))

          p = Path('README.md')
          text = p.read_text()
          marker = '| `git-hooks/`'
          if '`linters/`' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith(marker):
                      lines.insert(i, '| `linters/` | Canonical linter/formatter carriers consumed by Rig (Oxc baseline: Oxlint + Oxfmt). |')
                      break
              else:
                  raise SystemExit('README inventory marker not found')
              p.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''))

          p = Path('linters/oxc/README.md')
          text = p.read_text()
          addition = '''\n## Formatter default\n\nFor JS/TS repositories that adopt the Oxc baseline, **Oxfmt is the default formatter**. Rig should provision its carrier and enable the format check only when repository-local `oxfmt` is declared. A foreign formatter is a migration/coexistence signal, not something Rig silently deletes.\n'''
          if '## Formatter default' not in text:
              p.write_text(text.rstrip() + addition + '\n')
          PY
      - name: Validate
        run: python -m pytest -q
      - name: Commit fixes and remove one-shot workflow
        run: |
          rm .github/workflows/followup-lint-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: address merged lint-policy review findings"
          git push origin HEAD:fix/lint-review-followups
