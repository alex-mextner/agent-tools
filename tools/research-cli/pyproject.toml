[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-cli"
version = "0.1.0"
description = "Multi-provider research/panel CLI built on the shared agent-tools providers engine (board, failover, key cascade, capability tags). A distinct tool from review-cli — research, not code review."
readme = "README.md"
# Match the ecosystem floor: agenttools-providers targets >=3.9.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["llm", "research", "multi-model", "panel", "providers", "agent-tools"]

# The one runtime dependency is the shared providers CORE. Caret-style range so patch and
# minor fixes flow in, exact-pin avoided (dependency-version-ranges skill). When this tool
# is spun out to its own repo it depends on the published distribution; inside the umbrella
# checkout it is installed editable from ../../lib/agenttools_providers (see README).
dependencies = ["agenttools-providers>=0.1.0,<0.2.0"]

[project.optional-dependencies]
# yaml: needed to read a models.yaml manifest file (the default board path). The CORE
# imports PyYAML lazily, so a caller passing an in-memory registry never needs it.
yaml = ["pyyaml"]
test = ["pytest", "pyyaml"]

[project.scripts]
research = "research_cli.cli:main"

[project.urls]
Homepage = "https://github.com/alex-mextner/agent-tools"
Tracking = "https://github.com/alex-mextner/agent-tools/issues/13"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_cli*"]
