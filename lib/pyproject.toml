[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttools-log"
version = "0.1.0"
description = "Shared structured JSONL logging for the agent-tools ecosystem (stdlib-only)."
readme = "README.md"
# 3.9 to match the lowest floor in the ecosystem (review-cli is >=3.9; rig-cli >=3.10).
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["logging", "jsonl", "structured-logging", "agent-tools"]
# Intentionally ZERO runtime dependencies — stdlib only (logging + json + a tiny
# formatter). See lib/agenttools_log/__init__.py for the dependency rationale.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/alex-mextner/agent-tools"

# The package lives directly under lib/ (this file's directory). Scope discovery to it so
# setuptools never wanders into the umbrella repo's non-Python content (skills/, ci/, …).
[tool.setuptools.packages.find]
where = ["."]
include = ["agenttools_log*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
