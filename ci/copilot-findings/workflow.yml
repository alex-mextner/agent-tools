# Surface GitHub Copilot's AI findings on a PR (advisory by default).
#
# READ ci/copilot-findings/README.md FIRST — there is no single "Copilot findings" API.
# This reads the two real surfaces: Copilot code-REVIEW comments (by the bot) and
# code-scanning alerts (where Copilot Autofix attaches). It prints them to the job log and,
# if GATE=1, fails when any are present.
#
# INSTALL: copy to .github/workflows/copilot-findings.yml.
#
# REQUIREMENTS / CAVEATS:
#   • Copilot code review must be REQUESTED on the PR (manually, or via repo settings
#     "automatically request Copilot review") for review comments to exist.
#   • Code-scanning alerts need GitHub Advanced Security (private repos) or a public repo.
#   • This is ADVISORY by default (GATE unset). Copilot review, like any AI reviewer, has
#     false positives — gating hard on it is usually wrong (see ci/ai-review/).
#
# Triggered by `pull_request` with read-only `security-events: read` to read alerts.

name: copilot-findings

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to surface findings for (required — manual runs have no PR in the event payload)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  security-events: read

jobs:
  copilot-findings:
    name: copilot-findings (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Surface Copilot findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          # GATE: '1'   # uncomment to FAIL the check when Copilot findings exist
        run: bash ci/copilot-findings/copilot-findings.sh
