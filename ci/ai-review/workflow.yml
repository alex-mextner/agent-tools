# AI code review on the PR diff — posts findings as a sticky PR comment.
#
# Generalizes the "an AI reviewer comments on every PR" pattern. It runs a CONFIGURABLE
# review CLI (codex / review-cli / claude / gemini / your own) over the PR diff and posts
# the findings. It is ADVISORY by default — a non-blocking comment, NOT a required gate —
# because an LLM reviewer has false positives and should inform a human, not auto-block.
#
# INSTALL: copy to .github/workflows/ai-review.yml AND keep the script at
# ci/ai-review/ai-review.sh (vendor the ci/ dir, or copy + adjust the run: path).
#
# YOU MUST PROVIDE:
#   1. A way to install the review CLI (the "Install review CLI" step — edit for your tool).
#   2. The API key that CLI needs, as a repo/org SECRET, wired into `env:` below. Use a
#      GENERIC secret name; do not hard-code a provider. Examples: OPENAI_API_KEY,
#      ANTHROPIC_API_KEY, AI_REVIEW_API_KEY.
#
# SECURITY — this is the part most "AI review on PR" workflows get WRONG:
#   The job holds an API-key SECRET. If it ran PR-CONTROLLED code (checked out the PR head
#   and ran a script the PR can edit), ANY contributor who can open a same-repo branch PR
#   could rewrite that script and exfiltrate the key. Skipping forks does NOT close that hole
#   (same-repo branches still have it). So this workflow:
#     • uses `pull_request_target` and checks out the BASE branch — the SCRIPT that runs is
#       the trusted base copy, never the PR's;
#     • fetches the PR diff as DATA (`git diff` of the PR head SHA) and feeds that to the
#       reviewer — the diff is READ, never executed;
#     • never runs a build/test/install of PR code (that WOULD execute it under the
#       privileged trigger). HARD RULE: keep it diff-only.
#   The reviewer command + its install step come from the trusted base + your config.
#   Caveat: it does NOT run on the PR that first introduces it (base has no workflow yet).

name: ai-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI review (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BASE branch (trusted script) with full history
        # Default ref under pull_request_target = base. The script + install step that run
        # are the trusted base copies, not the PR's.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch the PR head commit as DATA (not checked out / not executed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"

      - name: Install review CLI
        # EDIT THIS for your reviewer. Examples (uncomment/replace one):
        #   npm i -g @your-org/review-cli
        #   pipx install your-reviewer
        #   curl -fsSL https://example.com/install.sh | sh
        # This runs from the TRUSTED base checkout — never install/run anything from the PR.
        run: |
          echo "::warning::Edit the 'Install review CLI' step to install your reviewer (codex / review-cli / etc.)."
          exit 0

      - name: Run AI review on the PR diff
        id: review
        env:
          AI_REVIEW_TOOL: codex            # built-in default; for others set AI_REVIEW_CMD
          AI_REVIEW_BASE: origin/${{ github.event.pull_request.base.ref }}
          AI_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          AI_REVIEW_OUT: ai-review-raw.md
          # Wire YOUR provider key here (generic name; set it as a repo secret):
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
        run: |
          bash ci/ai-review/ai-review.sh || echo "_AI review tool unavailable or errored — see logs._" > ai-review-raw.md
          [ -s ai-review-raw.md ] || echo "_No findings emitted._" > ai-review-raw.md
          # Build the final comment body in shell (the comment action posts literal text,
          # it does NOT expand $(...)). Fence the tool output so markdown is preserved.
          {
            echo '<!-- ai-review -->'
            echo '## AI review (advisory)'
            echo ''
            echo 'Findings below — verify each; this is peer review, not a gate.'
            echo ''
            echo '```'
            cat ai-review-raw.md
            echo '```'
          } > ai-review-comment.md

      - name: Find prior AI-review comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- ai-review -->'

      - name: Post / update sticky comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: ai-review-comment.md
