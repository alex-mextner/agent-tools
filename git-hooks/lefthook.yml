# lefthook.yml — example git-hook config for the lefthook runner.
#
# Pick the block matching your stack (bun/node, python-uv, or go) and delete the others,
# or merge them. For JS/TS the standard toolchain is Oxc: Oxlint + Oxfmt.

pre-commit:
  parallel: true
  commands:
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" pre-commit'

    # ---- JavaScript / TypeScript: Oxc ---------------------------------------------
    # These commands are enabled by Rig only after the repository declares the
    # corresponding Oxc tools. The generic example must not make commits fail merely
    # because a project has not adopted Oxc yet.
    # oxlint:
    #   glob: "*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
    #   run: node_modules/.bin/oxlint --type-aware {staged_files}
    #   fail_text: "Oxlint / anti-slop policy failed"
    # oxfmt:
    #   glob: "*.{ts,tsx,js,jsx,mts,cts,mjs,cjs,json,jsonc}"
    #   run: node_modules/.bin/oxfmt --check {staged_files}
    #   fail_text: "Oxfmt check failed"

    typecheck:
      glob: "*.{ts,tsx,mts,cts}"
      run: node_modules/.bin/tsc --noEmit
      fail_text: "typecheck failed"

    # The old regex `as any` / `as unknown as` / @ts-ignore gate is intentionally gone.
    # AST + type-aware policy is stronger:
    #   anti-slop/*
    #   typescript/no-unsafe-type-assertion
    #   typescript/no-unnecessary-type-assertion
    #   typescript/no-non-null-assertion
    #   typescript/ban-ts-comment

    # ---- python (uv) ---------------------------------------------------------------
    # ruff:
    #   glob: "*.py"
    #   run: uv run ruff check {staged_files} && uv run ruff format --check {staged_files}
    # mypy:
    #   glob: "*.py"
    #   run: uv run mypy .

    # ---- go ------------------------------------------------------------------------
    # gofmt:
    #   glob: "*.go"
    #   run: test -z "$(gofmt -l {staged_files})"
    # golangci:
    #   glob: "*.go"
    #   run: golangci-lint run ./...

commit-msg:
  commands:
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" commit-msg {1}'
    conventional-commit:
      run: ./git-hooks/commit-msg {1}
      fail_text: "commit subject must follow conventional-commit format"

pre-push:
  parallel: true
  commands:
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" pre-push'
    test:
      run: npm test
      fail_text: "tests failed — not pushing red"
