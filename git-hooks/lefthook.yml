# lefthook.yml — example git-hook config for the lefthook runner.
#
# Pick the block matching your stack (bun/node, python-uv, or go) and delete the others,
# or merge them — lefthook only runs commands whose tools exist. `lefthook install` wires
# these into the repo's git hooks; the config is committed, so every clone gets the same
# gates. See README.md.
#
# These mirror the standalone hooks in this directory. Run fast/scoped checks on
# pre-commit and the full suite on pre-push (see the pre-commit-gate skill).

pre-commit:
  parallel: true
  commands:
    # ---- global git-hook dispatcher (runs secret-scan + every future global hook) ---
    # This ONE command wires the repo into ~/.config/git/global-hooks.d/ so any hook
    # dropped there runs here too, with no further per-repo edits. The run: value MUST
    # be a single-quoted YAML scalar. See global-dispatcher/README.md and the
    # global-git-hooks skill. The dispatcher's `10-secret-scan` supersedes the standalone
    # `no-secrets` command below — keep that one commented to avoid running gitleaks twice
    # (the dispatcher's DEDUP / `.githooks-skip` is the documented way to reconcile both).
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" pre-commit'
    # ---- bun / node ----------------------------------------------------------------
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}
      fail_text: "lint failed — fix before committing (no --no-verify)"
    typecheck:
      glob: "*.{ts,tsx}"
      run: node_modules/.bin/tsc --noEmit
      fail_text: "typecheck failed"
    # ---- python (uv) ---------------------------------------------------------------
    # ruff:
    #   glob: "*.py"
    #   run: uv run ruff check {staged_files} && uv run ruff format --check {staged_files}
    # mypy:
    #   glob: "*.py"
    #   run: uv run mypy .
    # ---- go ------------------------------------------------------------------------
    # gofmt:
    #   glob: "*.go"
    #   run: test -z "$(gofmt -l {staged_files})"
    # golangci:
    #   glob: "*.go"
    #   run: golangci-lint run ./...
    # ---- universal: no type escape hatches (see no-type-escape-hatches skill) -------
    no-type-escape-hatches:
      glob: "*.{ts,tsx}"
      # Flag unjustified casts/ignores in staged TS. A justified @ts-expect-error with
      # an explanatory comment on the SAME line is allowed; bare ones are not.
      run: |
        if grep -nE '\bas any\b|\bas unknown as\b' {staged_files}; then
          echo "no-type-escape-hatches: remove 'as any' / 'as unknown as' (see the skill)"; exit 1
        fi
        if grep -nE '@ts-ignore' {staged_files}; then
          echo "no-type-escape-hatches: use @ts-expect-error with a justification, not @ts-ignore"; exit 1
        fi
      fail_text: "type escape hatch found"
    # ---- universal: secret scan -----------------------------------------------------
    # The dispatcher's `10-secret-scan` already covers this when the dispatcher line
    # above is present, so a separate local secret scan is redundant — keeping BOTH runs
    # gitleaks TWICE. Leave it commented if you use the dispatcher. If you DO want a
    # local one (e.g. a repo not wired to the dispatcher), uncomment it AND add a tracked
    # `.githooks-skip` with a `secret-scan` line so the dispatcher skips its global copy
    # (run-global-hooks DEDUP — install-local-hooks.sh writes that file automatically).
    # no-secrets:
    #   run: ./git-hooks/no-secrets-scan
    #   fail_text: "secret detected in staged changes"

commit-msg:
  commands:
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" commit-msg {1}'
    conventional-commit:
      run: ./git-hooks/commit-msg {1}
      fail_text: "commit subject must follow conventional-commit format"

pre-push:
  parallel: true
  commands:
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" pre-push'
    test:
      # bun/node — swap for `uv run pytest` or `go test ./...` per stack.
      run: npm test
      fail_text: "tests failed — not pushing red"
